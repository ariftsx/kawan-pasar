[project]
name = "kp-ingest"
version = "0.1.0"
description = "Kawan Pasar price ingest service (CSV seed now, PIHPS adapter later)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.12",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "mypy>=1.18",
    "ruff>=0.14",
]

[project.scripts]
kp-ingest = "kp_ingest.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_ingest"]

[tool.uv]
# Supply-chain gate, same intent as pnpm's minimumReleaseAge: ignore releases newer than this.
exclude-newer = "2026-11-04T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["kp_ingest"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RET", "PTH", "TRY", "RUF"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S608"]
