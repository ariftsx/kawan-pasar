[project]
name = "kawan-pasar-ingest"
version = "0.1.0"
description = "Kawan Pasar daily price ingest: validates PIHPS prices for the supported commodities."
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
# The ARIF-Net PIHPS collector (arif-collect @ git+...@<sha>) joins here once ING-01 is fixed
# and the collector is packaged (decision D-20). Until then only test sources exist.
dependencies = [
  "pydantic>=2.14,<3",
  "structlog>=26.1,<27",
]

[dependency-groups]
dev = [
  "pip-audit>=2.10,<3",
  "pyright>=1.1.414,<1.2",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
]

[tool.uv]
package = false
# Supply-chain cooldown, the same policy as pnpm minimumReleaseAge (docs 14 §2, 15 §8).
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# docs 14 §6
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["ingest", "tests"]
strict = ["ingest"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=ingest --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]
