# Local stack (docs 20 PR 10, F0-X3): web, api, worker, model, Postgres 18, and two Valkey 9
# instances (P-05). Mirrors the production shape in docs 17 §5: only web is published, and only
# on 127.0.0.1; everything else sits on the internal network.
#
#   pnpm stack:env   # once: writes infra/.env with random local secrets
#   pnpm stack:up    # build and start, then wait for every health check
#   pnpm stack:down  # stop (add -v to drop the volumes)
name: kawan-pasar

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: kawan_pasar
      POSTGRES_USER: kp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm stack:env}
    volumes: [kp-pg:/var/lib/postgresql]
    networks: [kp-internal]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kp -d kawan_pasar']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: '1.0', memory: 512M } } }

  valkey-cache:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    # Cache: evicts least-recently-used keys, nothing persisted.
    command: >-
      valkey-server --requirepass ${VALKEY_PASSWORD:?run pnpm stack:env}
      --maxmemory 64mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    networks: [kp-internal]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment: { VALKEY_PASSWORD: '${VALKEY_PASSWORD}' }
    deploy: { resources: { limits: { cpus: '0.25', memory: 96M } } }

  valkey-queue:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    # Queue (BullMQ): never evicts, appends every write to disk.
    command: >-
      valkey-server --requirepass ${VALKEY_PASSWORD:?run pnpm stack:env}
      --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes
    volumes: [kp-queue:/data]
    networks: [kp-internal]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment: { VALKEY_PASSWORD: '${VALKEY_PASSWORD}' }
    deploy: { resources: { limits: { cpus: '0.25', memory: 96M } } }

  model:
    <<: *hardened
    build: { context: ../services/model }
    image: kp-model:dev
    environment:
      MODEL_HMAC_SECRET: ${MODEL_HMAC_SECRET:?run pnpm stack:env}
      OUTLOOK_MODE: development
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
    networks: [kp-internal]
    deploy: { resources: { limits: { cpus: '0.75', memory: 512M } } }

  api:
    <<: *hardened
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: kp-api:dev
    environment: &api-env
      NODE_ENV: production
      PORT: '4000'
      SERVICE_TOKEN: ${SERVICE_TOKEN:?run pnpm stack:env}
      # Docker's default bridge range stands in for the Traefik overlay subnet locally.
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    networks: [kp-internal]
    depends_on:
      postgres: { condition: service_healthy }
      valkey-cache: { condition: service_healthy }
      valkey-queue: { condition: service_healthy }
      model: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '0.50', memory: 320M } } }

  worker:
    <<: *hardened
    image: kp-api:dev
    command: ['node', 'dist/worker.js']
    environment: *api-env
    networks: [kp-internal]
    # No HTTP server yet: healthy while the worker process (PID 1) is alive. Queue checks
    # replace this once BullMQ processors exist.
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      api: { condition: service_started }
    deploy: { resources: { limits: { cpus: '0.30', memory: 256M } } }

  web:
    <<: *hardened
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_APP_URL: 'http://localhost:3000', NEXT_PUBLIC_DATA_MODE: demo }
    image: kp-web:dev
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      API_INTERNAL_URL: http://api:4000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    ports: ['127.0.0.1:3000:3000']
    networks: [kp-internal, kp-edge]
    depends_on:
      api: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '0.50', memory: 384M } } }

networks:
  # No route to the outside world: api, model, and data stores are unreachable from the host.
  kp-internal: { internal: true }
  kp-edge: {}

volumes:
  kp-pg: {}
  kp-queue: {}
