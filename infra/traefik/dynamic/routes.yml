http:
  routers:
    # Public site: everything goes to the Next.js web server.
    web:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      priority: 1
      # A request that reaches a replica which just stopped is retried on the other one.
      middlewares: [retry@file, compress-html@file]
      service: web

    # Immutable build assets (hashed file names): same service, brotli compression.
    static:
      entryPoints: [web]
      rule: PathPrefix(`/_next/static/`)
      priority: 50
      middlewares: [retry@file, compress-static@file]
      service: web

    # Internal endpoints (cache revalidation) are for the Docker network only. Traefik refuses
    # them before they reach the web server; the endpoint additionally requires its own token.
    block-internal:
      entryPoints: [web]
      rule: PathPrefix(`/api/internal`)
      priority: 100
      service: noop@internal

  services:
    web:
      loadBalancer:
        # Round-robin over two replicas sharing one page cache (ADR 0010). The generous timeout
        # keeps a replica that is slow under CPU pressure in rotation instead of dropping it.
        servers:
          - url: http://web-1:3000
          - url: http://web-2:3000
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 8s
        responseForwarding:
          flushInterval: 100ms
