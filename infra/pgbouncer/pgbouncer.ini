; PgBouncer — transaction pooling in front of PostgreSQL.
; Application roles authenticate with SCRAM; their secrets are fetched through
; auth_query (pgbouncer.get_auth) so no application password lives in a file.
[databases]
kawanpasar = host=postgres port=5432 dbname=kawanpasar
kawanpasar_test = host=postgres port=5432 dbname=kawanpasar_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
max_db_connections = 50
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits
query_wait_timeout = 10
client_idle_timeout = 300
server_idle_timeout = 60
admin_users =
stats_users =
log_connections = 0
log_disconnections = 0
