name: kawan-pasar

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# Account settings shared by the API and the worker (Fase 2A).
x-account-env: &account-env
  VALKEY_SESSION_URL: redis://:${VALKEY_PASSWORD}@valkey-session:6379/0
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: 'Kawan Pasar <no-reply@kawanpasar.local>'
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:8080}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (node scripts/gen-env.mjs --add-missing)}
  PHONE_ENC_KEY: ${PHONE_ENC_KEY:?set PHONE_ENC_KEY (node scripts/gen-env.mjs --add-missing)}
  # Only during a key rotation (docs/security/autentikasi.md): the previous PHONE_ENC_KEY.
  PHONE_ENC_KEY_PREVIOUS: ${PHONE_ENC_KEY_PREVIOUS:-}

# Both web replicas run the same image and settings; only the fixed address differs (ADR 0010).
x-web: &web
  <<: *hardening
  build:
    context: ../..
    dockerfile: apps/web/Dockerfile
    args:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:8080}
  image: kawan-pasar/web:local
  cap_drop: [ALL]
  read_only: true
  mem_limit: 512m
  pids_limit: 256
  # Pages and data are cached in Valkey (shared by the replicas), so the writable directories only
  # hold Next.js housekeeping files. Size-limited so nothing can fill the host disk.
  tmpfs:
    - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
    - /app/apps/web/.next/server/route-cache:size=16m,uid=1000,gid=1000,mode=0700
    - /tmp:size=16m
  # No depends_on: static pages are served without the API, and a missing cache only means
  # rendering without it (fail-open).
  environment:
    NODE_ENV: production
    API_INTERNAL_URL: http://api:3001
    API_TIMEOUT_MS: '3000'
    PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:8080}
    SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
    WEB_REVALIDATE_TOKEN: ${WEB_REVALIDATE_TOKEN:?set WEB_REVALIDATE_TOKEN}
    # Database 1 of the cache Valkey (the API uses 0; tests use 14 and 15).
    VALKEY_WEB_CACHE_URL: redis://:${VALKEY_PASSWORD}@valkey-cache:6379/1

networks:
  edge:
    name: kp-edge
  backend:
    name: kp-backend
    internal: true
    # Fixed subnet so the API can trust exactly one proxy address (the web/BFF container).
    #   static (below .128): 172.30.0.2 traefik, 172.30.0.10 web-1, 172.30.0.11 web-2
    #                        (172.30.0.12 is reserved for the load-test client, Fase 1D)
    #   dynamic (ip_range):  172.30.0.128/25 for every other container
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  valkey-queue-data:

services:
  postgres:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      KP_OWNER_PASSWORD: ${KP_OWNER_PASSWORD:?set KP_OWNER_PASSWORD}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD}
      INGEST_W_PASSWORD: ${INGEST_W_PASSWORD:?set INGEST_W_PASSWORD}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?set PGBOUNCER_AUTH_PASSWORD}
      TZ: Asia/Jakarta
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c timezone=Asia/Jakarta
      -c log_min_duration_statement=500
      -c password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    <<: *hardening
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?set PGBOUNCER_AUTH_PASSWORD}
    entrypoint: ['/bin/sh', '-c']
    command:
      - umask 077 && printf '"pgbouncer_auth" "%s"\n' "$$PGBOUNCER_AUTH_PASSWORD" > /tmp/userlist.txt && exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey-cache:
    <<: *hardening
    image: valkey/valkey:9-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey-queue:
    <<: *hardening
    image: valkey/valkey:9-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - valkey-queue-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # Sessions (Fase 2A): never evicted (a full cache must not log users out), no disk: a restart
  # only means signing in again (ADR 0011, design Fase 2 §3).
  valkey-session:
    <<: *hardening
    image: valkey/valkey:9-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$VALKEY_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction --save '' --appendonly no
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli --no-auth-warning -a "$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail catcher (Fase 2A, owner decision): SMTP inside the backend network only; its web
  # inbox is published by the dev-tools overlay. A real provider only needs a different SMTP_URL.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.33.1
    read_only: true
    # Messages live in a temporary database under /tmp (nothing kept across restarts).
    tmpfs:
      - /tmp:size=32m
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: 'false'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'false'
    networks: [backend]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    <<: *hardening
    image: traefik:v3.7.18
    read_only: true
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      edge: {}
      backend:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *hardening
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: kawan-pasar/api:local
    cap_drop: [ALL]
    read_only: true
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      pgbouncer: { condition: service_healthy }
      valkey-cache: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/kawanpasar
      DATABASE_POOL_MAX: '10'
      VALKEY_CACHE_URL: redis://:${VALKEY_PASSWORD}@valkey-cache:6379/0
      VALKEY_QUEUE_URL: redis://:${VALKEY_PASSWORD}@valkey-queue:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: '120'
      RATE_LIMIT_INTERNAL_PER_MINUTE: '1200'
      TRUSTED_PROXY_IPS: 172.30.0.10,172.30.0.11
      # The API tells the web servers which cache tags to revalidate after data changes. The
      # page cache is shared, so one accepted call is enough; every replica is called so that a
      # replica that is down (or a failed shared write) does not lose the revalidation.
      WEB_INTERNAL_URL: http://web-1:3000,http://web-2:3000
      WEB_REVALIDATE_TOKEN: ${WEB_REVALIDATE_TOKEN:?set WEB_REVALIDATE_TOKEN (node scripts/gen-env.mjs --add-missing)}
      <<: *account-env
    networks: [backend]

  # Background jobs (e-mail from Fase 2A). Same image as the API, no port, dynamic address: it is
  # never a trusted proxy. Healthy while its heartbeat file is fresh.
  worker:
    <<: *hardening
    image: kawan-pasar/api:local
    command: ['node', 'dist/worker.js']
    cap_drop: [ALL]
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=8m,uid=1000,gid=1000
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/kawanpasar
      DATABASE_POOL_MAX: '4'
      VALKEY_CACHE_URL: redis://:${VALKEY_PASSWORD}@valkey-cache:6379/0
      VALKEY_QUEUE_URL: redis://:${VALKEY_PASSWORD}@valkey-queue:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *account-env
    healthcheck:
      test: ['CMD', 'node', 'dist/worker/healthcheck.js']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [backend]

  web-1:
    <<: *web
    networks:
      backend:
        # Trusted to forward client IPs (TRUSTED_PROXY_IPS on the API).
        ipv4_address: 172.30.0.10

  web-2:
    <<: *web
    networks:
      backend:
        ipv4_address: 172.30.0.11

  # ARIF-Net inference (Fase 2B, ADR 0012): one-shot, started by scripts/model-export.mjs. It gets
  # the price file the API exported and writes one bundle. No database, no network, no ports.
  model-export:
    profiles: [model]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    build:
      context: ../../services/model-arifnet
    image: kawan-pasar/model-arifnet:local
    read_only: true
    network_mode: none
    volumes:
      # Input read-only; output in its own folder, so the job cannot touch other bundles.
      - ../../services/model-arifnet/artifacts/.input:/input:ro
      - ../../services/model-arifnet/artifacts/arifnet:/out
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  ingest:
    profiles: [jobs]
    security_opt:
      - no-new-privileges:true
    build:
      context: ../../services/ingest
    image: kawan-pasar/ingest:local
    read_only: true
    depends_on:
      pgbouncer: { condition: service_healthy }
    environment:
      INGEST_DATABASE_URL: postgres://ingest_w:${INGEST_W_PASSWORD}@pgbouncer:6432/kawanpasar
      # After a run the job asks the API to drop its cached prices (best effort; TTL otherwise).
      API_INTERNAL_URL: http://api:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
    volumes:
      - ../../data/seed:/data/seed:ro
    networks: [backend]
