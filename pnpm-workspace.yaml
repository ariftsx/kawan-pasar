packages:
  - apps/*
  - packages/*

# Supply-chain policy (docs 14 §2, 15 §8): only install versions published at least 3 days ago.
minimumReleaseAge: 4320

# Install scripts are blocked unless reviewed and listed here.
allowBuilds:
  lefthook: true
  # Only a fallback binary download; the platform binary comes via optionalDependencies.
  unrs-resolver: false

engineStrict: true
